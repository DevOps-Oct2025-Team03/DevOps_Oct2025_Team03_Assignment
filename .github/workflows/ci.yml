name: DevSecOps CI Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: write
  packages: write

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.version.outputs.rc_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Generate version first so it can be used for Docker tags and Release names
      - name: Generate Version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RC_VERSION="v0.0.0-rc.${TIMESTAMP}.${SHORT_SHA}"
          echo "rc_version=${RC_VERSION}" >> $GITHUB_OUTPUT
          echo "RC Version: ${RC_VERSION}"

      - name: Start Infrastructure (PostgreSQL + Flask)
        run: |
          docker compose up -d --build

      - name: Wait for Flask to be ready
        run: |
          echo "Waiting for Flask /health endpoint..."
          for i in {1..20}; do
            if curl -s http://localhost:5000/health | grep -q ok; then
              echo "Flask is ready"
              break
            fi
            echo "Waiting..."
            sleep 3
          done

      - name: Verify Database Auto-Seeding
        run: |
          docker exec app-db psql -U postgres -d appdb -c "\dt"
          docker exec app-db psql -U postgres -d appdb -c "SELECT username, role FROM users;"

      - name: Run Security & Data Isolation Tests
        run: |
          docker compose exec -T web pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Tag your Docker image with the RC Version for better tracking 
      - name: Build and Push Docker Image (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ steps.version.outputs.rc_version }}

      # 3. Create Draft Release automatically after tests pass, hello 
      - name: Create Draft Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.rc_version }}
          draft: true
          body: |
            # Release Candidate3
            **Version:** ${{ steps.version.outputs.rc_version }}
            **Status:** Passed all CI/CD security and isolation tests on branch: ${{ github.ref_name }}.
            **Next Step:** Publish this release to finalize the deployment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create K8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

  notify-success:
    name: Notify Stakeholders on Success
    runs-on: ubuntu-latest
    needs: [build-test-docker] 
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Success Message
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="PRODUCTION RELEASE READY %0ARepository: \`${{ github.repository }}\` %0ABranch: \`main\` %0AAll build and security tests passed. Code is verified on main branch."