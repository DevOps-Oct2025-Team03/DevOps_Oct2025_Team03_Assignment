name: DevSecOps CI Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  packages: write

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout repository
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ======================================================
      # NEW ADDITION: SAST Security Scan
      # We run this immediately after checkout.
      # If this fails, the whole pipeline stops here.
      # ======================================================
      - name: Set up Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        # FIX: Changed target to 'app/' and added severity level to match your standalone SAST workflow.
        # This prevents test files from failing the pipeline.
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium

      - name: Upload Bandit Report
        if: always() # Uploads report even if the scan fails
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-json
          path: bandit-report.json
      # ======================================================
      # END OF NEW ADDITION
      # ======================================================

      # ----------------------------
      # 2. Start Docker infrastructure
      # ----------------------------
      - name: Start Infrastructure (PostgreSQL + Flask)
        run: |
          docker compose up -d --build

      # ----------------------------
      # 3. Wait for Flask health endpoint
      # ----------------------------
      - name: Wait for Flask to be ready
        run: |
          echo "Waiting for Flask /health endpoint..."
          for i in {1..20}; do
            if curl -s http://localhost:5000/health | grep -q ok; then
              echo "Flask is ready"
              break
            fi
            echo "Waiting for Flask..."
            sleep 3
          done

      # ----------------------------
      # 3.5 Initialize Database (FIXED)
      # ----------------------------
      - name: Seed Database
        run: |
          echo "Seeding database to create tables..."
          docker compose exec -T web python seed.py

      # ----------------------------
      # 4. Verify DB tables + auto-seeding
      # ----------------------------
      - name: Verify Database Auto-Seeding
        run: |
          docker exec app-db psql -U postgres -d appdb -c "\dt"
          docker exec app-db psql -U postgres -d appdb -c "SELECT username, role FROM users;"

      # ----------------------------
      # 5. Run tests (security + isolation)
      # ----------------------------
      - name: Run Security & Data Isolation Tests
        run: |
          docker compose exec -T web pytest -v

      # ----------------------------
      # 6. Verify infrastructure status
      # ----------------------------
      - name: Verify Infrastructure Status
        run: docker ps

      # ----------------------------
      # 7. Build & Push image to GHCR
      # ----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (GHCR) - dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and Push Docker Image (GHCR) - main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # ----------------------------
      # 7.5 Create a temporary K8s cluster for testing
      # ----------------------------
      - name: Create K8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      # ----------------------------
      # 8. Infrastructure as Code (Terraform)
      # ----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # Simulation for Local K8s Cluster
      - name: Terraform Apply (Simulation)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: echo "Terraform would now apply the k8s manifests to the cluster."