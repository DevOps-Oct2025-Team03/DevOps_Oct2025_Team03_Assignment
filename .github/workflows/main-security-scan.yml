name: Unified DevSecOps Security Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # --- 1. SAST JOB ---
  sast:
    name: CodeQL Code Scan (SAST)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast
      - name: Notify Telegram on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text=" *SAST SCAN FAILED*%0A%0A*Repo:* \`${{ github.repository }}\` %0A Critical error in CodeQL analysis. Please check the logs."

  # --- 2. SCA JOB ---
  sca:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DevSecOps_Team03'
          path: '.' 
          format: 'ALL'
          out: 'reports'
          args: --failOnCVSS 7 --enableRetired --scan requirements.txt --enableExperimental
      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: reports/
      - name: Notify Telegram on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text=" *SCA SCAN FAILED*%0A%0A*Repo:* \`${{ github.repository }}\` %0A Vulnerabilities found in dependencies (CVSS > 7)."

  # --- 3. DAST JOB ---
  dast:
    name: OWASP ZAP Scan (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Start Infrastructure
        run: |
          docker compose up -d --build
          timeout 60s bash -c 'until curl -s localhost:5000; do sleep 2; done'
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          artifact_name: 'zap-baseline-report'
        continue-on-error: true
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:5000'
          artifact_name: 'zap-fullscan-report'
        continue-on-error: true
      - name: Upload DAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-security-reports
          path: |
            report_html.html
            report_json.json
      - name: Notify Telegram on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="*DAST SCAN FAILED*%0A%0A*Repo:* \`${{ github.repository }}\` %0A The live application scan encountered an error."

  # --- 4. SUCCESS NOTIFICATION FOR STAKEHOLDERS ---
  notify-success:
    name: Notify Stakeholders on Success
    runs-on: ubuntu-latest
    needs: [sast, sca, dast] 
    if: success() 
    steps:
      - name: Send Formatted Success Message
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="*SECURITY PIPELINE SUCCESS* %0A%0A*Repository:* \`${{ github.repository }}\` %0A*Branch:* \`${{ github.ref_name }}\` %0A*Status:* All Scans Passed%0A%0AThe code on branch \`${{ github.ref_name }}\` has been verified by **SAST, SCA, and DAST**. %0A@Stakeholders: The code is clean and ready for review."