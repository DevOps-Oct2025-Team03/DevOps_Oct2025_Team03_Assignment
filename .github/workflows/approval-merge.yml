name: 2-Approval and Merge to Main (CD)

on:
  release:
    types: [published] # When you click "Publish" on a draft release

permissions:
  contents: write       # needed to push the PR branch
  pull-requests: write  # needed to create/modify PR test

jobs:
  pr_to_main:
    name: Create PR dev -> main
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo test
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Configure git identity (for pushing PR branch)
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3) Create a release branch from origin/dev and push it.
      - name: Create & push PR branch from dev
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BR="release/${TAG}"
          git fetch origin dev
          git checkout -B "$BR" origin/dev
          git push -u origin "$BR" --force

      # 4) Create PR only if there are new commits
      - name: Create PR (if missing)
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          BR="release/${TAG}"
          
          # Check if there are differences between main and the new branch
          # This returns a count of commits
          COMMITS=$(git rev-list --count origin/main.."$BR")

          if [ "$COMMITS" -eq 0 ]; then
            echo "No new commits between main and $BR. Skipping PR."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            # Proceed with existing PR check or creation
            EXISTING_PR_NUMBER="$(gh pr list --base main --head "$BR" --json number --jq '.[0].number' 2>/dev/null || echo '')"
            if [ -n "$EXISTING_PR_NUMBER" ]; then
              echo "pr_number=$EXISTING_PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              gh pr create --base main --head "$BR" --title "Release ${TAG}" --body "Automated PR."
              NEW_PR_NUMBER="$(gh pr list --base main --head "$BR" --json number --jq '.[0].number')"
              echo "pr_number=$NEW_PR_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          fi


      # 5) Notify Telegram that PR was created 
      - name: Notify Telegram (PR created)
        if: steps.pr.outputs.pr_number != ''
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="*RELEASE PR CREATED* %0A%0A*Repo:* \`${{ github.repository }}\` %0A*Branch:* \`${{ github.ref_name }}\` %0A*Release:* \`${{ github.event.release.tag_name }}\` %0A*PR:* #${{ steps.pr.outputs.pr_number }} %0A%0APlease review + approve."

      - name: Notify Telegram (Failure)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="*RELEASE PIPELINE FAILED* %0A%0A*Repo:* \`${{ github.repository }}\` %0A*Branch:* \`${{ github.ref_name }}\` %0A*Release:* \`${{ github.event.release.tag_name }}\` %0A%0ACheck GitHub Actions logs."