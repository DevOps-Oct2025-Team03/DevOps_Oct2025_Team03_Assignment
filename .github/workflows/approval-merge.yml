name: 2-Approval and Merge to Main (CD)

on:
  release:
    types: [published] # Triggers when you click "Publish" on a draft release

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge to main
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout with PAT (Bypasses Branch Protection)
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Using your PAT secret here allows the push to main later
          token: ${{ secrets.MY_RELEASE_PAT }}

      # ----------------------------
      # 2. Configure Git Identity
      # ----------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ----------------------------
      # 3. Perform Merge (dev -> main)
      # ----------------------------
      - name: Merge dev to main
        run: |
          # Ensure we have the latest from both branches
          git fetch origin main
          git fetch origin dev
          
          # Switch to main and pull latest
          git checkout main
          git pull origin main
          
          # Merge dev into main with a non-fast-forward commit
          git merge origin/dev --no-ff -m "Release ${{ github.event.release.tag_name }} approved"

      # ----------------------------
      # 4. Push Changes to Main
      # ----------------------------
      - name: Push to GitHub
        run: |
          # This push succeeds because the checkout used your MY_RELEASE_PAT
          git push origin main
          echo "Successfully merged dev to main branch!"

      # ----------------------------
      # 5. Notify Stakeholders via Telegram
      # ----------------------------
      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="*PRODUCTION RELEASE DEPLOYED* %0A%0A*Repo:* \`${{ github.repository }}\` %0A*Release:* \`${{ github.event.release.tag_name }}\` %0A%0AAll security scans and CI tests passed. The code has been merged to *main* and is now live. Stakeholders, the release is complete!"