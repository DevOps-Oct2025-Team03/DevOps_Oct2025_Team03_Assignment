name: 3-Deploy to Staging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. FIX: You MUST have this step to "Stage the Output" version
      - name: Get Version from Tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "STAGED VERSION: ${VERSION}"

      # 2. This now works because it references the id: version above
      - name: Show Version in Summary (GET TAG VERSION)
        run: |
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "* **Captured Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Status:** Testing Staging Infrastructure" >> $GITHUB_STEP_SUMMARY

      # --- LAYER 1: DOCKER VERIFICATION ---
      - name: Start Docker Infrastructure
        run: docker compose up -d --build

      - name: Wait for Flask to be ready
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:5000/health | grep -q ok; then
              echo "Flask is ready"
              break
            fi
            sleep 3
          done

      - name: Run Final Tests
        run: docker compose exec -T web pytest -v

      # --- LAYER 2: TERRAFORM & K8S DEPLOYMENT ---
      - name: Create K8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Apply
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Verify K8s Deployment
        run: |
          kubectl get pods
          kubectl get services

      - name: Trigger Render Deploy Hook (Staging)
        if: success()
        run: |
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # --- NOTIFICATIONS ---
      - name: Notify Telegram (Deployment Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="STAGING DEPLOYMENT SUCCESSFUL %0A%0ARepository: \`${{ github.repository }}\` %0ATag: \`${{ github.ref_name }}\` %0AVersion: \`${{ steps.version.outputs.version }}\` %0A%0AAll security tests passed."

      - name: Notify Telegram (Deployment Failure)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="Markdown" \
          -d text="STAGING DEPLOYMENT FAILED %0A%0ARepository: \`${{ github.repository }}\` %0AVersion: \`${{ steps.version.outputs.version }}\` %0A%0ACheck logs for Pytest or Terraform errors."