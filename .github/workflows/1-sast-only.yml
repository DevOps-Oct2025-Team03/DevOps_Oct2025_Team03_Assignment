# SAST (Static Application Security Testing) with CodeQL + Bandit
name: 1. SAST - Code Security Scan

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  security-events: write

jobs:
  # Bandit (fails the pipeline when vulnerabilities are found)
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Bandit
        run: pip install bandit
      
      # Fails the pipeline if any HIGH or MEDIUM issues are found
      - name: Run Bandit Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json --severity-level medium
          
      - name: Display Results
        if: always()
        run: |
          echo "=== Bandit SAST Results ==="
          cat bandit-report.json | python -m json.tool
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-bandit-report
          path: bandit-report.json

  # Job 2: CodeQL (uploads results to Security tab)
  codeql:
    name: CodeQL Code Scan
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended 
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast